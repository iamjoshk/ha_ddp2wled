send_to_wled_ddp:
  name: Send to WLED via DDP
  description: Send an image directly to a WLED device using the DDP (Distributed Display Protocol). This is the recommended method for best performance and reliability. Supports both URLs and local file paths. The image will persist on the device after transmission completes.
  fields:
    image_url:
      name: Image URL
      description: URL of the image to send (can be a template that reads from sensor attributes). Either image_url or image_path must be provided, but not both.
      required: false
      example: "{{ states.sensor.album_art.attributes.entity_picture }}"
      selector:
        text:
    image_path:
      name: Image Path
      description: Local file path of the image to send (e.g., /config/www/image.png). Either image_url or image_path must be provided, but not both.
      required: false
      example: "/config/www/album_art.jpg"
      selector:
        text:
    wled_host:
      name: WLED Host
      description: IP address or hostname of WLED device
      required: true
      example: "192.168.1.100"
      selector:
        text:
    width:
      name: Width
      description: Target width in pixels (required for DDP). 
      required: true
      selector:
        number:
          min: 1
          max: 256
          mode: box
    height:
      name: Height
      description: Target height in pixels (required for DDP).
      required: true
      selector:
        number:
          min: 1
          max: 256
          mode: box
    segment_id:
      name: Segment ID
      description: WLED segment ID to target (default is 0)
      default: 0
      advanced: true
      selector:
        number:
          min: 0
          max: 31
          mode: box
    timeout:
      name: Timeout
      description: Request timeout in seconds
      default: 10
      advanced: true
      selector:
        number:
          min: 1
          max: 60
          mode: box
    brightness:
      name: Brightness
      description: Overall LED brightness of the display (0-255, can be a template)
      default: 255
      example: "{{ states('sensor.adaptive_lighting_brightness') }}"
      selector:
        text:
    auto_bright:
      name: Auto Image Adjustment
      description: >-
        Enable automatic image adjustment. Helps fix washed out images.
      default: true
      advanced: true
      selector:
        boolean:
    clip_hist_percent:
      name: Auto Clipping Percentage
      description: >-
        Histogram clipping percentage for auto brightness/contrast (lower = less aggressive).
        Only used when Auto Image Adjustment is enabled.
      default: 0
      advanced: true
      selector:
        number:
          min: 0.0
          max: 50.0
          step: 1.0
          mode: slider
    saturation:
      name: Saturation
      description: Color saturation adjustment (1.0 = no change, 0.0 = grayscale, 2.0 = highly saturated)
      advanced: true
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.1
          mode: slider
    contrast:
      name: Contrast
      description: Image contrast adjustment (1.0 = no change, 0.0 = gray, 2.0 = high contrast)
      advanced: true
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.1
          mode: slider
    sharpen:
      name: Sharpen
      description: Image sharpening intensity (0.0 = no sharpening, 1.0 = maximum sharpening)
      advanced: true
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.1
          mode: slider
    balance_r:
      name: Red Balance
      description: Red channel color balance (1.0 = no change, 0.0 = no red, 2.0 = enhanced red)
      advanced: true
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.1
          mode: slider
    balance_g:
      name: Green Balance
      description: Green channel color balance (1.0 = no change, 0.0 = no green, 2.0 = enhanced green)
      advanced: true
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.1
          mode: slider
    balance_b:
      name: Blue Balance
      description: Blue channel color balance (1.0 = no change, 0.0 = no blue, 2.0 = enhanced blue)
      advanced: true
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.1
          mode: slider
    gamma:
      name: Gamma Correction
      description: Gamma correction for LED display (0.5 = default for LEDs, 1.0 = no change, lower = brighter)
      advanced: true
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1
          mode: slider
    keepalive_seconds:
      name: Keepalive Seconds
      description: >-
        Might help prevent image from reverting to live override if issues occur.
        Set to 0 to disable.
      default: 0
      advanced: true
      selector:
        number:
          min: 0
          max: 600
          mode: box
    keepalive_interval:
      name: Keepalive Interval
      description: Seconds between keepalive sends while keepalive is active
      default: 1
      advanced: true
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: slider

stop_ddp_stream:
  name: Stop DDP Stream
  description: Stop an active DDP stream to a specific WLED device. This will cancel any ongoing keepalive tasks and turn off live mode. The clear_display option attempts different approaches but may not preserve frames on all WLED versions.
  fields:
    wled_host:
      name: WLED Host
      description: IP address or hostname of WLED device to stop streaming to
      required: true
      example: "192.168.1.100"
      selector:
        text:
    segment_id:
      name: Segment ID
      description: WLED segment ID to stop (default is 0)
      default: 0
      selector:
        number:
          min: 0
          max: 31
          mode: box
    clear_display:
      name: Clear Display
      description: If true, simply turns off live mode (typically restores previous state). If false, attempts to preserve current frame by setting solid color effect (may not work on all WLED versions).
      default: true
      selector:
        boolean: