convert_image:
  name: Convert Image
  description: Convert an image from a URL to WLED format using the Pixel Magic Tool API. Returns the converted WLED JSON as a service response.
  response:
    optional: true
  fields:
    image_url:
      name: Image URL
      description: URL of the image to convert (can be a template that reads from sensor attributes)
      required: true
      example: "{{ states.sensor.album_art.attributes.entity_picture }}"
      selector:
        text:
    width:
      name: Width
      description: Target width in pixels (optional, API will use default if not specified)
      required: false
      selector:
        number:
          min: 1
          max: 256
          mode: box
    height:
      name: Height
      description: Target height in pixels (optional, API will use default if not specified)
      required: false
      selector:
        number:
          min: 1
          max: 256
          mode: box
    brightness:
      name: Brightness
      description: LED brightness (0-255)
      default: 128
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    pattern:
      name: Pattern
      description: Output pattern format
      default: range
      selector:
        select:
          options:
            - label: Individual
              value: individual
            - label: Index
              value: index
            - label: Range
              value: range
    segment_id:
      name: Segment ID
      description: WLED segment ID
      default: 0
      selector:
        number:
          min: 0
          max: 32
          mode: box
    transparent_color:
      name: Transparent Color
      description: Hex color to use for transparent pixels (optional)
      required: false
      example: "00BFFF"
      selector:
        text:
    api_url:
      name: API URL
      description: Pixel Magic Tool API endpoint
      default: "https://pixelmagictool.vercel.app/api/wled/image"
      required: false
      selector:
        text:
    compression:
      name: Enable Compression
      description: Compress color data to reduce payload size (helpful for large images)
      default: false
      selector:
        boolean:
    compression_level:
      name: Compression Level
      description: Compression strength (1=gentlest, 10=most aggressive)
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: slider

send_to_wled:
  name: Send to WLED
  description: Convert an image and send it directly to a WLED device. Returns the result status and WLED JSON as a service response.
  response:
    optional: true
  fields:
    image_url:
      name: Image URL
      description: URL of the image to convert (can be a template that reads from sensor attributes)
      required: true
      example: "{{ states.sensor.album_art.attributes.entity_picture }}"
      selector:
        text:
    wled_host:
      name: WLED Host
      description: IP address or hostname of WLED device
      required: true
      example: "192.168.1.100"
      selector:
        text:
    width:
      name: Width
      description: Target width in pixels (optional, API will use default if not specified)
      required: false
      selector:
        number:
          min: 1
          max: 256
          mode: box
    height:
      name: Height
      description: Target height in pixels (optional, API will use default if not specified)
      required: false
      selector:
        number:
          min: 1
          max: 256
          mode: box
    brightness:
      name: Brightness
      description: LED brightness (0-255)
      default: 128
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    pattern:
      name: Pattern
      description: Output pattern format
      default: range
      selector:
        select:
          options:
            - label: Individual
              value: individual
            - label: Index
              value: index
            - label: Range
              value: range
    segment_id:
      name: Segment ID
      description: WLED segment ID
      default: 0
      selector:
        number:
          min: 0
          max: 32
          mode: box
    transparent_color:
      name: Transparent Color
      description: Hex color to use for transparent pixels (optional)
      required: false
      example: "00BFFF"
      selector:
        text:
    timeout:
      name: Timeout
      description: Request timeout in seconds
      default: 10
      selector:
        number:
          min: 1
          max: 60
          mode: box
    api_url:
      name: API URL
      description: Pixel Magic Tool API endpoint
      default: "https://pixelmagictool.vercel.app/api/wled/image"
      required: false
      selector:
        text:
    compression:
      name: Enable Compression
      description: Compress color data to reduce payload size (helpful for large images)
      default: false
      selector:
        boolean:
    compression_level:
      name: Compression Level
      description: Compression strength (1=gentlest, 10=most aggressive)
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: slider
    use_chunks:
      name: Use Chunked Sending
      description: Split large payloads into multiple smaller requests sent sequentially (helpful for very large images that exceed WLED's limits)
      default: false
      selector:
        boolean:
    chunk_size:
      name: Chunk Size
      description: Number of LEDs per chunk when using chunked sending (WLED recommends 256 colors per request)
      default: 256
      selector:
        number:
          min: 64
          max: 2048
          mode: box
    colors_only:
      name: Colors Only Mode
      description: Send minimal payload with only color data (seg.i and seg.id), reducing overhead by ~40-60 bytes. WLED will use default or existing values for other parameters (fx, sel, on, bri, live).
      default: false
      selector:
        boolean:

